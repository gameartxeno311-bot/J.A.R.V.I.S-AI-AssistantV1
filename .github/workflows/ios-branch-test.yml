name: iOS Branch Test

on:
  push:
    branches:
      - ios-version
  pull_request:
    branches:
      - ios-version

jobs:
  test-ios-branch:
    name: Test iOS Branch
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
