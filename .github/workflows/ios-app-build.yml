name: iOS App Build

on:
  push:
    branches: [ios-version]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate Xcode project
        run: xcodegen generate --spec JARVISiOS/project.yml --project JARVISiOS/JARVISiOS.xcodeproj
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project JARVISiOS/JARVISiOS.xcodeproj \
            -scheme JARVISiOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build
      - name: Package unsigned IPA
        run: |
          test -d build/JARVISiOS.app
          mkdir -p Payload
          cp -R build/JARVISiOS.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload JARVISiOS-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVISiOS-unsigned-ipa
          path: JARVISiOS-unsigned.ipa
