name: iOS App Build

on:
  push:
    branches: [ios-version]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Build iOS app
        run: |
          xcodebuild \
            -project JARVISiOS/JARVISiOS.xcodeproj \
            -scheme JARVISiOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
