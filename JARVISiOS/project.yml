name: JARVISiOS
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.jarvis
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: 5.0
targets:
  JARVISiOS:
    type: application
    platform: iOS
    sources:
      - path: JARVISiOSApp.swift
      - path: ContentView.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.assistant
      PRODUCT_NAME: JARVISiOS
      INFOPLIST_KEY_CFBundleDisplayName: J.A.R.V.I.S
      INFOPLIST_KEY_NSCameraUsageDescription: J.A.R.V.I.S uses the camera for visual analysis.
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: YES
